[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "floodseg"
version = "0.1.0"
description = "Flood water segmentation from Sentinel-1 SAR and Sentinel-2 optical satellite imagery"
readme = "README.md"
authors = [{ name = "FloodSeg contributors" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "segmentation-models-pytorch>=0.3.3",
    "rasterio>=1.3.9",
    "albumentations>=1.4.0",
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    "wandb>=0.16.0",
    "pydantic>=2.5.0",
    "tifffile>=2024.1.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "matplotlib>=3.8.0",
    "requests>=2.31.0",
    "tqdm>=4.66.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "ipykernel>=6.29.0",
    "ipywidgets>=8.1.0",
]

# Milestone 5 case study: Planetary Computer STAC access and the interactive map
casestudy = [
    "pystac-client>=0.7.0",
    "planetary-computer>=1.0.0",
    "folium>=0.15.0",
]

[project.scripts]
floodseg = "floodseg.cli:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
