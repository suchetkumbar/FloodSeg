# Sen1Floods11 dataset configuration.
# Split CSVs and normalization-stat paths are resolved in code from (root_dir, split_type,
# modality) via floodseg.data.splits, so there is a single source of truth.

name: "sen1floods11"
root_dir: "data"
cache_dir: "data/cache/sen1floods11"  # decoded float16 chips; null = always read GeoTIFFs
modality: "fusion"  # 's1', 's2', or 'fusion'
split_type: "official"  # 'official' or 'loeo'

# Modality channel counts
channels:
  s1: 2
  s2: 13
  fusion: 15

# Training uses random crops (as in Bonafilia et al., 2020); val/test use full 512x512 tiles.
train_crop_size: [256, 256]

# Labels
num_classes: 1
ignore_index: -1
