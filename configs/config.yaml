# Primary Hydra configuration for FloodSeg.
# Usage:  python scripts/train_model.py dataset.modality=s1 dataset.split_type=loeo seed=1337
#         python scripts/train_model.py +experiment=s1_only

defaults:
  - _self_
  - dataset: sen1floods11
  - model: unet_resnet34
  - train: default

seed: 42
deterministic: false  # true = bit-reproducible cuDNN (slower); seeds are always fixed
variant: "standard"  # free-form tag, e.g. "cloudaug"; non-standard variants get a name suffix
experiment_name: "${dataset.split_type}_${dataset.modality}_${train.loss}${variant_suffix:${variant}}_seed${seed}"
output_dir: "outputs/runs/${experiment_name}"

wandb:
  project: "floodseg"
  entity: null
  mode: "offline"  # 'online', 'offline' or 'disabled'
  tags: ["sen1floods11", "${model.name}", "${dataset.modality}", "${dataset.split_type}"]

hydra:
  run:
    dir: ${output_dir}
  job:
    chdir: false
